<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>蘇菲媽咪團購帳本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap">
<style>
:root{
  --paper:#F3F5F2; --surface:#FFFFFF; --sunk:#E9EEEA; --ink:#1C2B29; --muted:#5E6E69; --line:#D6DED9;
  --accent:#1F6B5C; --accent-ink:#FFFFFF; --accent-soft:#E0EEE9; --amber:#A66A12; --amber-soft:#FBF0DC;
  --good:#2C7A4B; --bad:#B3261E; --bad-soft:#FBE7E5; --bar:#9FC7BC;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#111716; --surface:#19211F; --sunk:#141B19; --ink:#E3ECE8; --muted:#94A49F; --line:#2B3834;
    --accent:#62C1A9; --accent-ink:#0E1A17; --accent-soft:#1D3530; --amber:#E4AB4E; --amber-soft:#3A2E17;
    --good:#72CF98; --bad:#F2877E; --bad-soft:#3A1F1C; --bar:#2F5B51;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#111716; --surface:#19211F; --sunk:#141B19; --ink:#E3ECE8; --muted:#94A49F; --line:#2B3834;
  --accent:#62C1A9; --accent-ink:#0E1A17; --accent-soft:#1D3530; --amber:#E4AB4E; --amber-soft:#3A2E17;
  --good:#72CF98; --bad:#F2877E; --bad-soft:#3A1F1C; --bar:#2F5B51;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
.num,td.n,th.n{font-variant-numeric:tabular-nums;text-align:right}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.bar1{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 16px 6px;max-width:1160px;margin:0 auto}
.brand{font-family:var(--serif);font-size:21px;letter-spacing:.04em;margin:0}
.brand small{font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:400;letter-spacing:.02em;margin-left:8px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good)} .dot.err{background:var(--bad)}
.period{margin-left:auto;display:flex;gap:6px;align-items:center}
nav.tabs{display:flex;gap:2px;overflow-x:auto;padding:0 12px;max-width:1160px;margin:0 auto;scrollbar-width:none}
nav.tabs button{border:0;background:none;color:var(--muted);font:inherit;font-size:14px;padding:9px 12px 10px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-current="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
main{max-width:1160px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
h2{font-size:19px;margin:0 0 4px;text-wrap:balance}
h3{font-size:15px;margin:0 0 8px}
.lede{color:var(--muted);margin:0 0 16px;font-size:13.5px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:grid;gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .l{font-size:12px;color:var(--muted);letter-spacing:.04em}
.kpi .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .v.pos{color:var(--good)} .kpi .v.neg{color:var(--bad)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.04em;background:var(--sunk);position:sticky;top:0}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;background:var(--sunk);border-top:1px solid var(--line)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--accent-soft)}
tr.sel td{background:var(--accent-soft)}
td.wrap{white-space:normal;min-width:160px}
.neg{color:var(--bad)} .pos{color:var(--good)} .mut{color:var(--muted)}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
td input{width:100%}
td input.q{width:84px;text-align:right}
td input.m{width:96px;text-align:right}
textarea{width:100%;min-height:120px;font-size:13px}
button.b{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:6px;cursor:pointer}
button.b:hover{border-color:var(--accent)}
button.p{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:13px;padding:4px 6px}
button.x:hover,button.x[data-armed]{color:var(--bad)}
.pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.pill.in{background:var(--accent-soft);color:var(--accent)}
.pill.ret{background:var(--amber-soft);color:var(--amber)}
.pill.warn{background:var(--bad-soft);color:var(--bad)}
.banner{padding:10px 14px;border-radius:8px;background:var(--amber-soft);color:var(--ink);font-size:13.5px;margin-bottom:14px}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.months button{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 8px;text-align:left;cursor:pointer}
.months button b{display:block;font-size:13px}
.months button span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.months button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{font-size:11.5px;color:var(--muted);text-align:center}
.cal button{font:inherit;min-height:52px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:4px 5px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:1px;overflow:hidden}
.cal button .d{font-size:12px;font-weight:700}
.cal button .t{font-size:11px;color:var(--accent);font-variant-numeric:tabular-nums}
.cal button .r{font-size:11px;color:var(--amber);font-variant-numeric:tabular-nums}
.cal button.sun{background:var(--sunk);color:var(--muted)}
.cal button[aria-pressed="true"]{outline:2px solid var(--accent)}
.cal .blank{visibility:hidden}
.two{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.totals{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:14px}
.totals b{font-variant-numeric:tabular-nums}
details summary{cursor:pointer;color:var(--accent);font-size:13.5px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:8px;font-size:14px;z-index:50}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.pricelist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:0 24px}
.pricelist div{display:flex;justify-content:space-between;gap:12px;padding:8px 2px;border-bottom:1px dashed var(--line)}
.pricelist b{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
.login{max-width:360px;margin:12vh auto 0;display:grid;gap:14px}
.login h2{font-family:var(--serif);font-size:24px}
.login input{font-size:22px;letter-spacing:.3em;text-align:center;padding:10px}
.login .err{color:var(--bad);font-size:13.5px;min-height:1.2em}
.who{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.who b{color:var(--ink);font-weight:500}
.busy .dot{background:var(--amber)}
@media (max-width:640px){.hm{display:none}td.wrap{min-width:110px;white-space:normal}}
td input:disabled{background:var(--sunk);color:var(--muted)}
</style>
</head>
<body>
<header class="top">
  <div class="bar1">
    <h1 class="brand">蘇菲媽咪團購帳本<small>進貨・銷售・庫存・毛利</small></h1>
    <span class="sync" id="sync"><span class="dot" id="syncDot"></span><span id="syncTxt">—</span><button class="x" id="btnRefresh" hidden>重新整理</button></span>
    <div class="period" id="period" hidden>
      <label for="selYear" class="mut" style="font-size:13px">年度</label>
      <select id="selYear"></select>
      <select id="selMonth" aria-label="月份"></select>
    </div>
    <div class="who" id="who" hidden><span id="whoName"></span><button class="x" id="btnLogout">登出</button></div>
  </div>
  <nav class="tabs" id="tabs" hidden>
    <button data-tab="dash" data-owner>營業統計</button>
    <button data-tab="buy" data-owner>進貨／退貨</button>
    <button data-tab="pay" data-owner>貨款</button>
    <button data-tab="sell">每日銷售</button>
    <button data-tab="count">庫存盤點</button>
    <button data-tab="items" data-owner>商品明細</button>
    <button data-tab="prices">商品售價表</button>
    <button data-tab="cust" data-owner>客戶編號</button>
    <button data-tab="exp" data-owner>雜支</button>
  </nav>
</header>
<main id="view"></main>
<div class="toast" id="toast" hidden></div>

<script>
/* ======== 設定：把 Apps Script 部署後的網址貼在這裡 ======== */
const API_URL = 'https://script.google.com/macros/s/AKfycbw2lnd3iodqSeS7cw0wnXYBAzijGxzwZ53XhXD93Zu8Vq-3Z7zRHcs6Y8w_xdDAplFX/exec';
/* ============================================================ */

(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(Math.round(+n||0)).toLocaleString('zh-TW');
const pct=(a,b)=>b?(a/b*100).toFixed(1)+'%':'—';
const WK='日一二三四五六';
const tw=()=>new Date(Date.now()+8*3600e3).toISOString().slice(0,10);
const wk=d=>WK[new Date(d+'T00:00:00Z').getUTCDay()];
const pad=n=>String(n).padStart(2,'0');
const byName=(a,b)=>String(a.name).localeCompare(String(b.name),'zh-Hant');
const EXP_CATS=['房租','水電','薪資','包材','運費','平台／手續費','其他'];
const ls={get:k=>{try{return localStorage.getItem(k);}catch(e){return null;}},set:(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(e){}}};

let S={products:{},purchases:{},sales:{},expenses:{},customers:{},counts:{},payments:[],payStart:'',payRate:1,revenue:{}};
const T=tw();
const UI={tab:'sell',year:+T.slice(0,4),month:+T.slice(5,7),pDate:T,sDate:T,cDate:T,dashMonth:+T.slice(5,7),drafts:{p:{},s:{},c:{}}};
let token=ls.get('gb_token'), me=null, loaded=false, busy=0;
try{me=JSON.parse(ls.get('gb_user')||'null');}catch(e){}
const apiUrl=()=>API_URL||ls.get('gb_api')||'';
const isOwner=()=>me&&me.role==='owner';

/* ---------- API ---------- */
function setSync(){const el=$('#sync');el.classList.toggle('busy',busy>0);$('#syncDot').className='dot '+(busy?'':(loaded?'ok':''));$('#syncTxt').textContent=busy?'處理中…':(loaded?'已同步 '+new Date().toTimeString().slice(0,5):'—');}
async function api(action,payload,okMsg){
  busy++;setSync();
  try{
    const r=await fetch(apiUrl(),{method:'POST',body:JSON.stringify(Object.assign({action,token},payload||{}))});
    const j=await r.json();
    if(!j.ok){if(j.relogin)logout(j.error);else toast(j.error||'操作失敗');return false;}
    if(j.token){token=j.token;me={name:j.name,role:j.role};ls.set('gb_token',token);ls.set('gb_user',JSON.stringify(me));}
    if(j.user){me=j.user;ls.set('gb_user',JSON.stringify(me));}
    if(j.data){S=j.data;loaded=true;}
    if(okMsg)toast(okMsg);
    return true;
  }catch(e){toast('連線失敗，請確認網路後再試一次');return false;}
  finally{busy--;setSync();}
}
function logout(msg){token=null;me=null;loaded=false;ls.set('gb_token',null);ls.set('gb_user',null);S={products:{},purchases:{},sales:{},expenses:{},customers:{},counts:{},payments:[],payStart:'',revenue:{}};UI.drafts={p:{},s:{},c:{}};render();if(msg)toast(msg);}

/* ---------- 通用 ---------- */
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600);}
function armed(btn){if(btn.dataset.armed)return true;btn.dataset.armed='1';const t=btn.textContent;btn.textContent='再按一次確認';setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.textContent=t;}},3000);return false;}
const prods=(all)=>Object.entries(S.products).map(([id,p])=>({id,...p})).filter(p=>all||!p.off).sort(byName);
function findPid(name){name=String(name).trim();for(const [id,p] of Object.entries(S.products))if(p.name===name)return id;return null;}
function matchProduct(raw){raw=String(raw).trim();let best=null,len=0;for(const [id,p] of Object.entries(S.products)){const n=p.name;if(n&&raw.startsWith(n)&&n.length>len){best=id;len=n.length;}}return best;}

/* ---------- 彙總 ---------- */
/* 只輸入營業總額的日子，用「進貨商品的平均毛利率」估算銷貨成本 */
function estMargin(){let r=0,g=0;for(const p of Object.values(S.purchases))for(const l of p.lines||[]){if(l.type==='ret')continue;const pr=(S.products[l.pid]||{}).price;if(pr&&l.cost){r+=l.qty*pr;g+=l.qty*(pr-l.cost);}}
  if(r)return g/r;let n=0,m=0;for(const p of Object.values(S.products))if(p.price&&p.cost){n++;m+=(p.price-p.cost)/p.price;}return n?m/n:null;}
function dayAgg(){
  const D={};const g=d=>D[d]||(D[d]={irev:0,icogs:0,man:null,rev:0,cogs:0,pin:0,pret:0,est:false,unk:false});
  for(const [d,s] of Object.entries(S.sales))for(const l of s.lines||[]){const x=g(d);x.irev+=l.qty*l.price;x.icogs+=l.qty*l.cost;}
  for(const [d,p] of Object.entries(S.purchases))for(const l of p.lines||[]){const x=g(d);if(l.type==='ret')x.pret+=l.qty*l.cost;else x.pin+=l.qty*l.cost;}
  for(const [d,r] of Object.entries(S.revenue||{})){g(d).man=+r.amount||0;}
  const EM=estMargin();
  for(const x of Object.values(D)){
    if(x.man===null){x.rev=x.irev;x.cogs=x.icogs;continue;}
    x.rev=x.man;const extra=Math.max(0,x.man-x.irev);
    if(!extra){x.cogs=x.icogs;continue;}
    if(EM===null){x.cogs=x.icogs+extra;x.unk=true;}else{x.cogs=x.icogs+extra*(1-EM);x.est=true;}
  }
  return D;
}
function expOf(ym){const e=S.expenses[ym];return e&&e.items?e.items.reduce((a,i)=>a+(+i.amount||0),0):0;}
function monthAgg(Y,D){
  const M=[];for(let m=1;m<=12;m++)M.push({m,rev:0,cogs:0,pin:0,pret:0,exp:expOf(Y+'-'+pad(m))});
  for(const [d,x] of Object.entries(D)){if(+d.slice(0,4)!==Y)continue;const o=M[+d.slice(5,7)-1];o.rev+=x.rev;o.cogs+=x.cogs;o.pin+=x.pin;o.pret+=x.pret;if(x.est||x.unk)o.est=true;}
  M.forEach(o=>{o.gp=o.rev-o.cogs;o.spend=o.pin-o.pret+o.exp;o.net=o.rev-o.spend;});
  return M;
}
function stockTable(asOf){
  const base={},baseDate={};
  for(const d of Object.keys(S.counts).sort()){if(d>=asOf)break;const c=S.counts[d].counts||{};for(const pid in c){base[pid]=+c[pid];baseDate[pid]=d;}}
  const R={};const g=pid=>R[pid]||(R[pid]={inQ:0,retQ:0,sold:0});
  const seen=new Set(Object.keys(base));for(const p of Object.values(S.purchases))for(const l of p.lines||[])seen.add(l.pid);
  for(const [d,p] of Object.entries(S.purchases)){if(d>asOf)continue;for(const l of p.lines||[]){if(baseDate[l.pid]&&d<=baseDate[l.pid])continue;const x=g(l.pid);if(l.type==='ret')x.retQ+=+l.qty;else x.inQ+=+l.qty;}}
  for(const [d,s] of Object.entries(S.sales)){if(d>asOf)continue;for(const l of s.lines||[]){if(baseDate[l.pid]&&d<=baseDate[l.pid])continue;g(l.pid).sold+=+l.qty;}}
  return prods(true).map(p=>{const x=R[p.id]||{inQ:0,retQ:0,sold:0};const b=base[p.id]||0;return {...p,base:b,baseDate:baseDate[p.id]||'',...x,expect:b+x.inQ-x.retQ-x.sold};}).filter(r=>seen.has(r.id));
}

/* ---------- 頁首 ---------- */
function fillHeader(){
  const on=!!(token&&me);
  $('#tabs').hidden=!on;$('#who').hidden=!on;$('#btnRefresh').hidden=!on;$('#period').hidden=!on||!isOwner();
  if(on){$('#whoName').innerHTML=`<b>${esc(me.name)}</b>（${isOwner()?'老闆':'員工'}）`;
    document.querySelectorAll('#tabs button').forEach(b=>{b.hidden=b.hasAttribute('data-owner')&&!isOwner();b.setAttribute('aria-current',b.dataset.tab===UI.tab);});}
  const ys=new Set([UI.year,+T.slice(0,4)]);for(const k of ['purchases','sales'])Object.keys(S[k]).forEach(d=>ys.add(+d.slice(0,4)));Object.keys(S.expenses).forEach(d=>ys.add(+d.slice(0,4)));
  $('#selYear').innerHTML=[...ys].sort().map(y=>`<option ${y===UI.year?'selected':''}>${y}</option>`).join('');
  $('#selMonth').innerHTML=Array.from({length:12},(_,i)=>`<option value="${i+1}" ${i+1===UI.month?'selected':''}>${i+1} 月</option>`).join('');
}
$('#selYear').onchange=e=>{UI.year=+e.target.value;render();};
$('#selMonth').onchange=e=>{UI.month=+e.target.value;UI.dashMonth=UI.month;render();};
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;UI.tab=b.dataset.tab;try{history.replaceState(null,'','#'+UI.tab);}catch(_){}render();window.scrollTo(0,0);};
$('#btnLogout').onclick=()=>logout('已登出');
$('#btnRefresh').onclick=async()=>{if(await api('load'))render();};

/* ---------- 各頁 ---------- */
const V={};

V.setup=()=>`<div class="login panel"><h2>第一次設定</h2><p class="lede" style="margin:0">請貼上 Google Apps Script 部署後的「網頁應用程式網址」（https://script.google.com/macros/s/…/exec）。建議直接寫進 index.html 最上方的 API_URL，員工的手機就不用再貼。</p>
<input id="apiIn" placeholder="https://script.google.com/macros/s/…/exec" style="font-size:14px;letter-spacing:0;text-align:left"><button class="b p" data-act="setapi">儲存網址</button></div>`;

V.login=()=>`<form class="login panel" id="loginForm"><h2>請輸入密碼</h2><p class="lede" style="margin:0">老闆和員工各有自己的密碼，由老闆在 Google 試算表的「人員」分頁設定。</p>
<input type="password" inputmode="numeric" autocomplete="current-password" id="pinIn" aria-label="密碼" autofocus><div class="err" id="loginErr"></div><button class="b p" type="submit">登入</button>
${API_URL?'':'<button class="x" type="button" data-act="resetapi">更換 API 網址</button>'}</form>`;

V.dash=()=>{
  const D=dayAgg(),M=monthAgg(UI.year,D);
  const Y=M.reduce((a,o)=>{for(const k of ['rev','cogs','gp','pin','pret','exp','spend','net'])a[k]=(a[k]||0)+o[k];return a;},{});

  let prev;do{prev=s;for(const p of P){const t=s.replace(p,'').trim();if(t&&t!==s){s=t;break;}}}while(prev!==s);return s;}

function recalcP(i){const dr=pDraft(UI.pDate);dr.lines.forEach((l,k)=>{const s=(+l.qty||0)*(+l.cost||0);const c=document.getElementById('ps'+k);if(c)c.textContent=(l.type==='ret'?'−':'')+fmt(s);

function parsePaste(txt,isRet){
  const out=[];let date=null,vendor='';
  for(let line of txt.split(/\r?\n/)){line=line.replace(/\s+$/,'');if(!line.trim())continue;
    const cells=line.split(/\t|\s{2,}|,/).map(s=>s.trim()).filter(Boolean);if(!cells.length)continue;
    let name=cells[0];let nums=cells.slice(1).map(s=>+s.replace(/[,$]/g,'')).filter(n=>!isNaN(n));
    if(cells.length===1){const m=line.trim().match(/^(.*?)\s+([\d.]+)\s+([\d.]+)(?:\s+[\d.]+)?$/);if(m){name=m[1];nums=[+m[2],+m[3]];}}
    if(/^[\d.,\s]+$/.test(name))continue;
    if(/小計|合計|總計/.test(name))continue;
    const dm=name.match(/^(\d{1,2})[\/\-.](\d{1,2})/);
    if(dm&&(!nums.length||nums.every(n=>!n))){date=UI.year+'-'+pad(+dm[1])+'-'+pad(+dm[2]);continue;}
    if(!nums.length||nums.every(n=>!n)){vendor=name;continue;}
    const pid=matchProduct(name);
    const qty=nums[0]||0;let cost=nums[1]!=null?nums[1]:(pid?S.products[pid].cost:0);
    const ret=isRet||qty<0||cost<0;
    out.push({type:ret?'ret':'in',vendor,name:pid?S.products[pid].name:cleanName(name),qty:Math.abs(qty),cost:Math.abs(cost||0)});
  }
  return {date,lines:out};
}

  return {on,paid,used,balance:paid-used,start,rate};
}

    ${shown.map(e=>`<tr ${e.k?`class="click" data-act="ygo" data-d="${e.d}"`:''}><td>${e.date.slice(5).replace('-','/')}（${wk(e.date)}）</td><td class="wrap">${e.text}</td><td class="n pos">${e.pay?fmt(e.pay):''}</td><td class="n">${e.use?fmt(e.use):''}</td><td class="n ${e.bal<0?'neg':''}"><b>${fmt(e.bal)}</b></td><td>${e.k?'':`<button class="x" data-act="ydel" data-id="${e.id}">刪除</button>`}</td></tr>`).join('')}

};

/* 每日銷售 */
function sDraft(d){if(!UI.drafts.s[d]){const doc=S.sales[d];const q={};(doc&&doc.lines||[]).forEach(l=>q[l.pid]=l.qty);UI.drafts.s[d]={dirty:false,q};}return UI.drafts.s[d];}
function saleTotals(){const d=UI.sDate,dr=sDraft(d),old={};(S.sales[d]&&S.sales[d].lines||[]).forEach(l=>old[l.pid]=l);let rev=0,cogs=0;
  for(const pid in dr.q){const p=S.products[pid]||{};const q=+dr.q[pid]||0;const pr=old[pid]?old[pid].price:(+p.price||0),co=old[pid]?old[pid].cost:(+p.cost||0);rev+=q*pr;cogs+=q*co;}
  return isOwner()?`<span>單日營業額 <b>${fmt(rev)}</b></span><span>毛利 <b>${fmt(rev-cogs)}</b></span><span>毛利率 <b>${pct(rev-cogs,rev)}</b></span>`:`<span>單日營業額 <b>${fmt(rev)}</b></span>`;}
V.sell=()=>{
  const d=UI.sDate,dr=sDraft(d),old={};(S.sales[d]&&S.sales[d].lines||[]).forEach(l=>old[l.pid]=l);
  const list=prods(false);Object.keys(dr.q).forEach(pid=>{if(S.products[pid]&&S.products[pid].off)list.push({id:pid,...S.products[pid]});});
  const doc=S.sales[d];
  const rows=list.map(p=>{const q=+dr.q[p.id]||0;const pr=old[p.id]?old[p.id].price:(+p.price||0);
    return `<tr data-name="${esc(p.name)}"><td class="wrap">${esc(p.name)}${!pr?' <span class="pill warn">未設售價</span>':''}</td><td class="n">${fmt(pr)}</td><td class="n"><input class="q" inputmode="decimal" data-sp="${p.id}" id="sq_${p.id}" value="${q||''}" placeholder="0"></td><td class="n" id="ss_${p.id}">${q?fmt(q*pr):''}</td></tr>`;}).join('');
  return `
  <h2>每日銷售</h2>
  <p class="lede">${isOwner()?'上方直接輸入當天營業總額；下方可以再登錄各品項賣出數量（有登錄的話，毛利和庫存會更準）。':'輸入當天每個商品賣出的數量後按儲存。'}</p>
  ${isOwner()?revPanel(d):''}
  <div class="panel stack" style="gap:12px;margin-top:14px">
    <div class="row" style="justify-content:space-between">
      <div class="row"><label for="sDate"><b>銷售日期</b></label><input type="date" id="sDate" value="${d}"><span class="pill">星期${wk(d)}</span>${doc?`<span class="pill in">${esc(doc.by||'')} 已登錄</span>`:''}${dr.dirty?'<span class="pill ret">尚未儲存</span>':''}</div>
      <input type="search" id="sFind" placeholder="搜尋商品" aria-label="搜尋商品" style="width:180px">
    </div>
    <div class="totals" id="stot">${saleTotals()}</div>
    ${list.length?`<div class="tw" style="max-height:62vh"><table><thead><tr><th>商品</th><th class="n">售價</th><th class="n">賣出數量</th><th class="n">小計</th></tr></thead><tbody id="sBody">${rows}</tbody></table></div>`:`<p class="mut">還沒有商品，請老闆先到「商品明細」新增。</p>`}
    <div class="row"><button class="b p" data-act="ssave">儲存這天銷售</button>${doc&&isOwner()?'<button class="x" data-act="swipe">刪除這天紀錄</button>':''}${dr.dirty?'<button class="x" data-act="sreset">放棄修改</button>':''}</div>
  </div>`;
};
function revPanel(d){const r=(S.revenue||{})[d];const it=(S.sales[d]&&S.sales[d].lines||[]).reduce((a,l)=>a+l.qty*l.price,0);
  return `<div class="panel stack" style="gap:10px"><div class="row" style="justify-content:space-between"><h3 style="margin:0">${d.slice(5).replace('-','/')}（${wk(d)}）營業額</h3>${r?`<span class="pill in">已存：${fmt(r.amount)}（${esc(r.by)} ${esc(String(r.at).slice(11))}）</span>`:'<span class="pill">尚未輸入</span>'}</div>
  <div class="row"><input id="rvAmt" inputmode="decimal" placeholder="當天營業總額" value="${r?esc(r.amount):''}" style="width:160px;font-size:18px"><input id="rvNote" placeholder="備註（例：現金 8,000＋轉帳 3,200）" value="${r?esc(r.note):''}" style="flex:1 1 220px"><button class="b p" data-act="rvsave">儲存營業額</button>${r?'<button class="x" data-act="rvdel">清除</button>':''}</div>
  ${it?`<p class="mut" style="font-size:12.5px;margin:0">下方品項合計 ${fmt(it)}${r?`，${Math.abs(r.amount-it)<1?'和營業額相符。':'和營業額差 '+fmt(r.amount-it)+'。'}`:'。'}</p>`:''}</div>`;}
function recalcS(){const d=UI.sDate,dr=sDraft(d),old={};(S.sales[d]&&S.sales[d].lines||[]).forEach(l=>old[l.pid]=l);
  for(const pid in dr.q){const p=S.products[pid]||{};const q=+dr.q[pid]||0;const pr=old[pid]?old[pid].price:(+p.price||0);const c=document.getElementById('ss_'+pid);if(c)c.textContent=q?fmt(q*pr):'';}
  const t=$('#stot');if(t)t.innerHTML=saleTotals();}

/* 庫存盤點 */
function cDraft(d){if(!UI.drafts.c[d]){const doc=S.counts[d];UI.drafts.c[d]={dirty:false,c:doc?Object.fromEntries(Object.entries(doc.counts).map(([k,v])=>[k,String(v)])):{}};}return UI.drafts.c[d];}
V.count=()=>{
  const d=UI.cDate,dr=cDraft(d),all=stockTable(d),doc=S.counts[d]||{counts:{},who:{}};
  const rows=all.filter(r=>countVisible(r,dr,doc));const hidden=all.length-rows.length;
  let val=0;if(isOwner())rows.forEach(r=>val+=Math.max(0,r.expect)*(+r.cost||0));
  const done=Object.keys(doc.counts).length;
  const hist=isOwner()?countHistory():'';
  return `
  <h2>庫存盤點</h2>
  <p class="lede">應有數量＝上次盤點數量＋之後進貨－退貨－賣出（算到盤點日當天）。在「實點數量」填實際點到的數字後送出，下次就以這次為基準。${isOwner()?'':'送出後就不能修改，點錯請找老闆。'}</p>
  <div class="panel stack" style="gap:12px">
    <div class="row" style="justify-content:space-between">
      <div class="row"><label for="cDate"><b>盤點日期</b></label><input type="date" id="cDate" value="${d}">${done?`<span class="pill in">已送出 ${done} 項</span>`:''}${dr.dirty?'<span class="pill ret">尚未送出</span>':''}</div>
      <input type="search" id="cFind" placeholder="搜尋商品" aria-label="搜尋商品" style="width:180px">
    </div>
    <div class="row" style="justify-content:space-between"><div class="totals"><span>要盤點的品項 <b>${rows.length}</b></span>${isOwner()?`<span>應有庫存金額（成本） <b>${fmt(val)}</b></span>`:''}</div>
      <label class="row" style="font-size:13px"><input type="checkbox" id="cZero" ${UI.showZero?'checked':''}> 顯示數量為 0 的商品${hidden?`（${hidden} 項已隱藏）`:''}</label></div>
    ${rows.length?`<div class="tw" style="max-height:62vh"><table><thead><tr><th>商品</th><th class="hm">上次盤點</th><th class="n hm">之後進貨</th><th class="n hm">退貨</th><th class="n hm">賣出</th><th class="n">應有數量</th><th class="n">實點數量</th><th class="n">差異</th><th>盤點人</th></tr></thead><tbody id="cBody">
    ${rows.map(r=>{const c=dr.c[r.id];const has=c!==undefined&&c!=='';const diff=has?(+c-r.expect):null;const locked=!isOwner()&&(r.id in doc.counts);
      return `<tr data-name="${esc(r.name)}"><td class="wrap">${esc(r.name)}</td><td class="mut hm">${r.baseDate?r.baseDate.slice(5).replace('-','/')+'：'+fmt(r.base):'—'}</td><td class="n hm">${r.inQ||''}</td><td class="n hm">${r.retQ||''}</td><td class="n hm">${r.sold||''}</td><td class="n"><b class="${r.expect<0?'neg':''}">${fmt(r.expect)}</b></td><td class="n"><input class="q" inputmode="decimal" data-cp="${r.id}" data-exp="${r.expect}" id="cq_${r.id}" value="${has?esc(c):''}" ${locked?'disabled':''}></td><td class="n" id="cd_${r.id}">${diff===null?'':`<span class="${diff<0?'neg':diff>0?'pos':'mut'}">${diff>0?'+':''}${fmt(diff)}</span>`}</td><td class="mut">${esc(doc.who&&doc.who[r.id]||'')}</td></tr>`;}).join('')}
    </tbody></table></div>`:`<p class="mut">${all.length?'目前沒有應該在店裡的商品。':'還沒有進貨紀錄。'}</p>`}
    <div class="row"><button class="b p" data-act="csave">送出盤點結果</button>${isOwner()?'<button class="b" data-act="cfill">空白的都填入應有數量</button><button class="b" data-act="cfill0">空白的都填 0（店裡已經沒有）</button>':''}${dr.dirty?'<button class="x" data-act="creset">放棄修改</button>':''}</div>
  </div>
  ${hist}`;
};
/* 只列出「應有數量大於 0」的商品；這天已經填過或送出的也保留，勾選「顯示數量為 0」則全部列出 */
function countVisible(r,dr,doc){if(UI.showZero||r.expect>0)return true;const c=dr.c[r.id];return (r.id in doc.counts)||(c!==undefined&&c!=='');}
function countHistory(){
  const ds=Object.keys(S.counts).sort().reverse().slice(0,30);if(!ds.length)return '';
  return `<div style="margin-top:18px"><h3>盤點紀錄（最近 30 次）</h3><div class="tw"><table><thead><tr><th>日期</th><th>盤點人</th><th class="n">品項</th><th class="n">有差異</th><th class="n">短少數量</th><th class="n">短少金額（成本）</th></tr></thead><tbody>
  ${ds.map(d=>{const c=S.counts[d];let n=0,dif=0,shortQ=0,shortV=0;const who=new Set();for(const pid in c.counts){n++;who.add(c.who[pid]);const df=c.counts[pid]-(c.expect[pid]||0);if(df)dif++;if(df<0){shortQ+=-df;shortV+=-df*((S.products[pid]||{}).cost||0);}}
    return `<tr class="click" data-act="cgo" data-d="${d}"><td>${d.slice(5).replace('-','/')}（${wk(d)}）</td><td>${esc([...who].filter(Boolean).join('、'))}</td><td class="n">${n}</td><td class="n">${dif?`<span class="pill warn">${dif}</span>`:'0'}</td><td class="n ${shortQ?'neg':''}">${shortQ?fmt(shortQ):''}</td><td class="n ${shortV?'neg':''}">${shortV?fmt(shortV):''}</td></tr>`;}).join('')}
  </tbody></table></div></div>`;
}

      ${items.length?`<div class="tw"><table><thead><tr><th>日期</th><th>類別</th><th class="n">金額</th><th>備註</th><th></th></tr></thead><tbody>${items.map(i=>`<tr><td>${esc(String(i.date).slice(5).replace('-','/'))}</td><td>${esc(i.cat)}</td><td class="n">${fmt(i.amount)}</td><td class="wrap">${esc(i.note)}</td><td><button class="x" data-act="edel" data-id="${i.id}">刪除</button></td></tr>`).join('')}</tbody><tfoot><tr><td colspan="2">本月合計</td><td class="n">${fmt(expOf(ym))}</td><td colspan="2"></td></tr></tfoot></table></div>`:'<p class="mut">這個月還沒有雜支。</p>'}
    </div>
    ${cats.length?`<div><h3>${Y} 年雜支分類</h3><div class="tw"><table><thead><tr><th>類別</th>${Array.from({length:12},(_,i)=>`<th class="n">${i+1}月</th>`).join('')}<th class="n">全年</th></tr></thead><tbody>${cats.map(c=>`<tr><td>${esc(c)}</td>${cat[c].map(v=>`<td class="n">${v?fmt(v):''}</td>`).join('')}<td class="n"><b>${fmt(cat[c].reduce((a,b)=>a+b,0))}</b></td></tr>`).join('')}</tbody></table></div></div>`:''}
  </div>`;
};

/* ---------- 繪製 ---------- */
let pending=false;
function editing(){const a=document.activeElement;return a&&$('#view').contains(a)&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)&&a.type!=='date';}
$('#view').addEventListener('focusout',()=>setTimeout(()=>{if(pending&&!editing()){pending=false;render();}},60));
function render(){
  for(const k of ['p','s','c'])for(const d in UI.drafts[k])if(!UI.drafts[k][d].dirty)delete UI.drafts[k][d];
  if(!apiUrl()){fillHeader();$('#view').innerHTML=V.setup();return;}
  if(!token||!me){fillHeader();$('#view').innerHTML=V.login();const p=$('#pinIn');if(p)p.focus();return;}
  const allowed=isOwner()?Object.keys(V):['sell','count','prices'];
  if(!allowed.includes(UI.tab)||UI.tab==='login'||UI.tab==='setup')UI.tab=isOwner()?'dash':'count';
  fillHeader();
  const y=window.scrollY;
  $('#view').innerHTML=loaded?V[UI.tab]():'<p class="mut">讀取資料中…</p>';
  window.scrollTo(0,y);
}
function filterRows(body,q){q=q.trim().toLowerCase();document.querySelectorAll(body+' [data-name]').forEach(r=>r.hidden=q&&!r.dataset.name.toLowerCase().includes(q));}
async function doAndRender(action,payload,msg){const ok=await api(action,payload,msg);if(editing())pending=true;else render();return ok;}

/* ---------- 事件 ---------- */
$('#view').addEventListener('submit',async e=>{
  if(e.target.id!=='loginForm')return;e.preventDefault();
  const pin=$('#pinIn').value.trim();if(!pin)return;$('#loginErr').textContent='';
  busy++;setSync();
  try{const r=await fetch(apiUrl(),{method:'POST',body:JSON.stringify({action:'login',pin})});const j=await r.json();
    if(!j.ok){$('#loginErr').textContent=j.error||'登入失敗';return;}
    token=j.token;me={name:j.name,role:j.role};ls.set('gb_token',token);ls.set('gb_user',JSON.stringify(me));
    UI.tab=me.role==='owner'?'dash':'count';
  }catch(err){$('#loginErr').textContent='連不到伺服器，請確認網址與網路';return;}
  finally{busy--;setSync();}
  render();if(await api('load'))render();
});
$('#view').addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.pi!=null){const dr=pDraft(UI.pDate);const l=dr.lines[+t.dataset.pi];l[t.dataset.f]=t.value;dr.dirty=true;recalcP(+t.dataset.pi);}
  else if(t.dataset.sp){const dr=sDraft(UI.sDate);dr.q[t.dataset.sp]=t.value;dr.dirty=true;recalcS();}
  else if(t.dataset.cp){const dr=cDraft(UI.cDate);dr.c[t.dataset.cp]=t.value;dr.dirty=true;const ex=+t.dataset.exp;const c=document.getElementById('cd_'+t.dataset.cp);if(c){if(t.value===''){c.innerHTML='';}else{const df=+t.value-ex;c.innerHTML=`<span class="${df<0?'neg':df>0?'pos':'mut'}">${df>0?'+':''}${fmt(df)}</span>`;}}}
  else if(t.id==='sFind')filterRows('#sBody',t.value);
  else if(t.id==='cFind')filterRows('#cBody',t.value);
  else if(t.id==='iFind')filterRows('#iBody',t.value);
  else if(t.id==='prFind')filterRows('#prBody',t.value);
  else if(t.id==='kFind')filterRows('#kBody',t.value);
});
$('#view').addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='pDate'){UI.pDate=t.value||T;UI.year=+UI.pDate.slice(0,4);UI.month=+UI.pDate.slice(5,7);render();return;}
  if(t.id==='sDate'){UI.sDate=t.value||T;render();return;}
  if(t.id==='cDate'){UI.cDate=t.value||T;render();return;}
  if(t.id==='cZero'){UI.showZero=t.checked;render();return;}
  if(t.dataset.pi!=null&&t.dataset.f==='name'){const l=pDraft(UI.pDate).lines[+t.dataset.pi];const pid=findPid(t.value);if(pid&&!(+l.cost)){l.cost=S.products[pid].cost;const c=document.getElementById('pc'+t.dataset.pi);if(c)c.value=l.cost;}recalcP(+t.dataset.pi);}
  if(t.dataset.pi!=null&&t.dataset.f==='type'){recalcP(+t.dataset.pi);}
  if(t.dataset.ip){const id=t.dataset.ip,f=t.dataset.f;const p={...S.products[id]};
    if(f==='off')p.off=t.checked;else if(f==='cost'||f==='price')p[f]=+t.value||0;else p[f]=t.value.trim();
    if(f==='name'&&!p.name){t.value=S.products[id].name;return;}
    S.products[id]=p;
    if(f==='cost'||f==='price'){const gp=(+p.price||0)-(+p.cost||0);const g=document.getElementById('ig_'+id),r=document.getElementById('ir_'+id);if(g)g.innerHTML=p.price?`<span class="${gp<0?'neg':''}">${fmt(gp)}</span>`:'—';if(r)r.textContent=p.price?pct(gp,p.price):'—';}
    await doAndRender('saveProduct',{id,name:p.name,unit:p.unit,cost:p.cost,price:p.price,off:p.off},'已更新');}
  if(t.dataset.kp){const id=t.dataset.kp;const c={...S.customers[id],[t.dataset.f]:t.value.trim()};S.customers[id]=c;await doAndRender('saveCustomer',{id,...c},'已更新');}
});
$('#view').addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='setapi'){const v=$('#apiIn').value.trim();if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(v)){toast('網址格式不對，應該是 https://script.google.com/macros/s/…/exec');return;}ls.set('gb_api',v);render();}
  else if(a==='resetapi'){ls.set('gb_api',null);render();}
  else if(a==='dm'){UI.dashMonth=+b.dataset.m;UI.month=UI.dashMonth;render();}
  else if(a==='pm'){UI.month=+b.dataset.m;render();}
  else if(a==='pday'){UI.pDate=b.dataset.d;render();}
  else if(a==='padd'||a==='paddr'){const dr=pDraft(UI.pDate);const lv=dr.lines.length?dr.lines[dr.lines.length-1].vendor||'':'';dr.lines.push({type:a==='paddr'?'ret':'in',vendor:lv,name:'',qty:'',cost:''});dr.dirty=true;render();const n=document.getElementById('pn'+(dr.lines.length-1));if(n)n.focus();}
  else if(a==='pdel'){const dr=pDraft(UI.pDate);dr.lines.splice(+b.dataset.i,1);dr.dirty=true;render();}
  else if(a==='preset'){delete UI.drafts.p[UI.pDate];render();}
  else if(a==='pparse'){const r=parsePaste($('#pPaste').value,$('#pRet').checked);if(!r.lines.length){toast('沒有讀到品項，請確認每行有名稱、數量、單價');return;}
    if(r.date&&r.date!==UI.pDate){UI.pDate=r.date;UI.month=+r.date.slice(5,7);}const dr=pDraft(UI.pDate);dr.lines.push(...r.lines);dr.dirty=true;render();toast(`已加入 ${r.lines.length} 個品項，確認後按「儲存這天」`);}
  else if(a==='psave'){const d=UI.pDate;const ok=await api('savePurchase',{date:d,lines:pDraft(d).lines,updCost:!!($('#pUpd')&&$('#pUpd').checked)},`已儲存 ${d.slice(5).replace('-','/')} 進貨／退貨`);if(ok)delete UI.drafts.p[d];render();}
  else if(a==='pwipe'){if(!armed(b))return;const d=UI.pDate;if(await api('savePurchase',{date:d,lines:[]},'已刪除這天進貨紀錄'))delete UI.drafts.p[d];render();}
  else if(a==='ssave'){const d=UI.sDate;if(await api('saveSales',{date:d,qty:sDraft(d).q},`已儲存 ${d.slice(5).replace('-','/')} 銷售`))delete UI.drafts.s[d];render();}
  else if(a==='sreset'){delete UI.drafts.s[UI.sDate];render();}
  else if(a==='swipe'){if(!armed(b))return;const d=UI.sDate;if(await api('saveSales',{date:d,qty:{}},'已刪除這天銷售'))delete UI.drafts.s[d];render();}
  else if(a==='csave'){const d=UI.cDate,dr=cDraft(d),doc=S.counts[d]||{counts:{}};const send={};
    for(const k in dr.c){if(dr.c[k]===''||dr.c[k]==null)continue;if(!isOwner()&&k in doc.counts)continue;send[k]=+dr.c[k];}
    if(!isOwner()&&!Object.keys(send).length){toast('沒有新填的數量');return;}
    if(await api('saveCount',{date:d,counts:send},'盤點已送出'))delete UI.drafts.c[d];render();}
  else if(a==='cfill'||a==='cfill0'){const dr=cDraft(UI.cDate),doc=S.counts[UI.cDate]||{counts:{}};stockTable(UI.cDate).filter(r=>countVisible(r,dr,doc)).forEach(r=>{if(dr.c[r.id]===undefined||dr.c[r.id]==='')dr.c[r.id]=a==='cfill0'?'0':String(r.expect);});dr.dirty=true;render();}
  else if(a==='creset'){delete UI.drafts.c[UI.cDate];render();}
  else if(a==='cgo'){UI.cDate=b.dataset.d;render();window.scrollTo(0,0);}
  else if(a==='rvsave'){const v=$('#rvAmt').value.trim();if(v===''||isNaN(+v.replace(/,/g,''))){toast('請輸入營業額數字');return;}
    await doAndRender('saveRevenue',{date:UI.sDate,amount:+v.replace(/,/g,''),note:$('#rvNote').value.trim()},'已儲存 '+UI.sDate.slice(5).replace('-','/')+' 營業額');}
  else if(a==='rvdel'){if(!armed(b))return;await doAndRender('saveRevenue',{date:UI.sDate,amount:''},'已清除營業額');}
  else if(a==='gopay'){UI.tab='pay';render();window.scrollTo(0,0);}
  else if(a==='yadd'){const amount=+$('#yAmt').value,date=$('#yDate').value;if(!amount||!date){toast('請輸入日期和金額');return;}
    await doAndRender('addPayment',{date,amount,to:$('#yTo').value.trim(),note:$('#yNote').value.trim()},'已登錄付款 '+fmt(amount));}
  else if(a==='ydel'){if(!armed(b))return;await doAndRender('deletePayment',{id:b.dataset.id},'已刪除付款');}
  else if(a==='yrate'){const r=+$('#yRate').value;if(!(r>0)){toast('請填數字，例如 1.022');return;}await doAndRender('setPayRate',{rate:r},'已設定加成倍率 '+r);}
  else if(a==='ystart'){await doAndRender('setPayStart',{date:$('#yStart').value},'已設定起算日');}
  else if(a==='ygo'){UI.pDate=b.dataset.d;UI.year=+b.dataset.d.slice(0,4);UI.month=+b.dataset.d.slice(5,7);UI.tab='buy';render();window.scrollTo(0,0);}
  else if(a==='iadd'){const name=$('#nName').value.trim();if(!name){toast('請輸入商品名稱');return;}
    await doAndRender('saveProduct',{name,unit:$('#nUnit').value.trim(),cost:+$('#nCost').value||0,price:+$('#nPrice').value||0,off:false},'已新增 '+name);}
  else if(a==='idel'){if(!armed(b))return;await doAndRender('deleteProduct',{id:b.dataset.id},'已刪除商品（歷史紀錄保留）');}
  else if(a==='iimport'){const items=[];$('#iPaste').value.split(/\r?\n/).forEach(ln=>{const c=ln.split(/\t|\s{2,}|,/).map(s=>s.trim()).filter(Boolean);if(c.length<2)return;const cost=+String(c[1]).replace(/[,$]/g,'');if(isNaN(cost))return;const price=c[2]!=null?+String(c[2]).replace(/[,$]/g,''):'';items.push({name:c[0],cost,price:isNaN(price)?'':price});});
    if(!items.length){toast('沒有讀到資料，每行要有名稱和成本');return;}await doAndRender('importProducts',{items},`已匯入 ${items.length} 項`);}
  else if(a==='prcopy'){const txt=prods(false).map(p=>`${p.name}　$${p.price?fmt(p.price):'—'}`).join('\n');try{await navigator.clipboard.writeText(txt);toast('已複製售價表');}catch(_){toast('無法自動複製，請手動選取文字');}}
  else if(a==='kadd'){const name=$('#kName').value.trim(),code=$('#kCode').value.trim();if(!name||!code){toast('請輸入編號和姓名');return;}
    await doAndRender('saveCustomer',{code,name,phone:$('#kPhone').value.trim(),note:$('#kNote').value.trim()},'已新增 '+code+' '+name);}
  else if(a==='kdel'){if(!armed(b))return;await doAndRender('deleteCustomer',{id:b.dataset.id},'已刪除客戶');}
  else if(a==='eadd'){const amount=+$('#eAmt').value,date=$('#eDate').value;if(!amount||!date){toast('請輸入日期和金額');return;}
    await doAndRender('addExpense',{date,cat:$('#eCat').value,amount,note:$('#eNote').value.trim()},'已新增支出');}
  else if(a==='edel'){if(!armed(b))return;await doAndRender('deleteExpense',{id:b.dataset.id},'已刪除');}
});

/* ---------- 啟動 ---------- */
try{const h=location.hash.slice(1);if(h)UI.tab=h;}catch(e){}
render();setSync();
if(apiUrl()&&token)api('load').then(ok=>{if(ok){if(editing())pending=true;else render();}});
setInterval(()=>{if(document.hidden||!token||!apiUrl()||busy)return;const dirty=['p','s','c'].some(k=>Object.values(UI.drafts[k]).some(d=>d.dirty));
  api('load').then(ok=>{if(!ok)return;if(editing()||dirty)pending=true;else render();});},120000);
})();
</script>
</body>
</html>
